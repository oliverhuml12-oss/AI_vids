<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[AGENCY] — AI video ads for small businesses</title>
  <meta name="description" content="AI-made video ads for Meta, built from your real product photos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- SVG filters: grain displacement for the lights -->
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <filter id="grainy-light" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="page">
    <!-- grainy green lights -->
    <div class="lights" aria-hidden="true">
      <span class="light l1"></span>
      <span class="light l2"></span>
      <span class="light l3"></span>
      <span class="light l4"></span>
      <span class="light l5"></span>
    </div>

    <header class="nav-wrap">
      <nav class="nav glass" aria-label="Main">
        <a class="logo" href="#top">[AGENCY]</a>
        <div class="nav-links">
          <a href="#work">Work</a>
          <a href="#info">Pricing</a>
          <a class="btn-light" href="#contact">Get in touch</a>
        </div>
      </nav>
    </header>

    <main>
      <!-- HERO: AI presenter video -->
      <section id="top" class="hero">
        <div class="hero-video glass" id="heroVideo">
          <!-- Placeholder until the AI presenter video is ready. Set HERO_VIDEO in script.js. -->
          <svg class="silhouette" viewBox="0 0 400 300" aria-hidden="true">
            <circle cx="200" cy="105" r="58"/>
            <path d="M60 300 C60 210 120 180 200 180 C280 180 340 210 340 300 Z"/>
          </svg>
          <span class="badge badge-ai"><span class="dot" aria-hidden="true"></span>AI generated</span>
          <span class="badge badge-placeholder">PLACEHOLDER · AI presenter video</span>
          <button class="play glass" type="button" aria-label="Play intro video">
            <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="scroll-cue" aria-hidden="true">
          <span>SCROLL</span>
          <i></i>
        </div>
      </section>

      <!-- WORK: two crossing tilted rows of ad videos -->
      <section id="work" class="work" aria-label="Past ads">
        <div class="strip strip-back"><div class="track" data-dir="-1" data-speed="0.35"></div></div>
        <div class="strip strip-front"><div class="track" data-dir="1" data-speed="0.55"></div></div>
      </section>

      <!-- INFO: blockouts for now -->
      <section id="info" class="info">
        <div class="container">
          <div class="section-head">
            <span class="label">[HOW IT WORKS]</span>
            <div class="bar bar-title"></div>
          </div>
          <div class="grid">
            <div class="card glass"><div class="num">01</div><div class="bar b-h"></div><div class="bar b-t"></div><div class="bar b-t w85"></div><div class="bar b-t w60"></div></div>
            <div class="card glass"><div class="num">02</div><div class="bar b-h"></div><div class="bar b-t"></div><div class="bar b-t w85"></div><div class="bar b-t w60"></div></div>
            <div class="card glass"><div class="num">03</div><div class="bar b-h"></div><div class="bar b-t"></div><div class="bar b-t w85"></div><div class="bar b-t w60"></div></div>
          </div>

          <div class="section-head spaced">
            <span class="label">[PACKAGES]</span>
            <div class="bar bar-title short"></div>
          </div>
          <div class="grid">
            <div class="tier glass"><div class="bar t-name"></div><div class="bar t-price"></div><hr><div class="bar b-t w90"></div><div class="bar b-t w75"></div><div class="bar b-t w82"></div><div class="fill"></div><div class="t-btn"></div></div>
            <div class="tier glass featured"><div class="bar t-name"></div><div class="bar t-price"></div><hr><div class="bar b-t w90"></div><div class="bar b-t w75"></div><div class="bar b-t w82"></div><div class="fill"></div><div class="t-btn"></div></div>
            <div class="tier glass"><div class="bar t-name"></div><div class="bar t-price"></div><hr><div class="bar b-t w90"></div><div class="bar b-t w75"></div><div class="bar b-t w82"></div><div class="fill"></div><div class="t-btn"></div></div>
          </div>

          <div id="contact" class="contact glass">
            <span class="label">[CONTACT]</span>
            <div class="bar c-title"></div>
            <div class="bar c-sub"></div>
            <a class="btn-light big" href="mailto:[YOUR EMAIL]">Get in touch</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="container footer">
      <span class="logo">[AGENCY]</span>
      <div class="footer-bars"><i></i><i></i><i></i></div>
    </footer>

    <!-- film grain over everything -->
    <div class="grain" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
